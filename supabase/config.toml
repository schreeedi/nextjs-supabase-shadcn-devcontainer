# Supabase local development configuration
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "nextjs-supabase-shadcn"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Local mail testing — OAuth doesn't need this, but magic links /
# email confirmations land here instead of real inboxes.
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# ── Google OAuth ─────────────────────────────────────────────
# Set env vars in .env (repo root, read by `supabase start`):
#   SUPABASE_AUTH_GOOGLE_CLIENT_ID
#   SUPABASE_AUTH_GOOGLE_SECRET
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# Local callback — register this in Google Cloud Console:
redirect_uri = "http://localhost:54321/auth/v1/callback"

# ── Facebook OAuth ───────────────────────────────────────────
# Set env vars in .env:
#   SUPABASE_AUTH_FACEBOOK_CLIENT_ID
#   SUPABASE_AUTH_FACEBOOK_SECRET
[auth.external.facebook]
enabled = true
client_id = "env(SUPABASE_AUTH_FACEBOOK_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_FACEBOOK_SECRET)"
# Register in Meta for Developers as a Valid OAuth Redirect URI:
redirect_uri = "http://localhost:54321/auth/v1/callback"
